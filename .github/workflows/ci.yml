name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show VERSION
        shell: powershell
        run: Get-Content .\VERSION
      - name: Parse and unit tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-All.ps1
      - name: Verify npm CLI wrapper and SDK unit tests
        shell: powershell
        run: |
          node .\tests\sdk.test.js
          node .\cli.js --version
          node .\cli.js --help
