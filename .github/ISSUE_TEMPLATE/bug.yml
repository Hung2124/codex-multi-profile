name: Bug report
description: Something broke while opening Codex or switching accounts
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Wrong account on screen, crash, Access Denied, poisoned auth, etc.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codex-multi-profile version
      description: Output of CodexAccounts.ps1 status (Version line) or the VERSION file
      placeholder: 0.1.2
  - type: input
    id: app
    attributes:
      label: Codex Desktop version
      placeholder: "e.g. 26.924.2738.0 (Codex (Store) line of CodexAccounts.ps1 status)"
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Run CodexAccounts.ps1 status and paste here (emails are already masked).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant lines of codex-accounts.log
      description: From %LOCALAPPDATA%\CodexMultiProfile\codex-accounts.log (emails are masked). Do not paste auth.json or tokens.
      render: text
