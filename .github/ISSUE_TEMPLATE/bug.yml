name: Bug report
description: Something broke while launching or swapping Codex accounts
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Wrong account on screen, crash, Access Denied, poisoned auth, etc.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codex-multi-profile version
      description: Output of CodexProfile.ps1 -Action status (Version line) or the VERSION file
      placeholder: 0.1.2
  - type: input
    id: app
    attributes:
      label: Codex Desktop version
      placeholder: e.g. folder name under %LOCALAPPDATA%\CodexParallelDesktop\versions
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Run CodexProfile.ps1 -Action doctor and paste here (emails are already masked).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Redacted launch-trace.log
      description: Prefer scripts/Redact-LaunchTrace.ps1 output. Do not paste auth.json or tokens.
      render: text
